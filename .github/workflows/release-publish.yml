name: Release Publish

on:
  push:
    branches:
      - beta
      - master

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build And Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is empty"
          }

          # The application reports package.json version at runtime, so the
          # built version must equal the release tag's version. Beta builds
          # therefore carry the prerelease suffix in package.json itself;
          # otherwise a 0.1.0 build can never see v0.1.0-beta.N updates.
          $baseVersion = ($version -split '-', 2)[0]

          if ($branch -eq "beta") {
            $buildVersion = "$baseVersion-beta.${{ github.run_number }}"
            $tag = "v$buildVersion"
            $channel = "beta"
            $prerelease = "true"
          } elseif ($branch -eq "master") {
            if ($version -match '-') {
              throw "Stable releases require a version without a prerelease suffix (found $version)."
            }
            $buildVersion = $version
            $tag = "v$version"
            $channel = "stable"
            $prerelease = "false"

            $tagCheck = & git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>&1
            Write-Host "tag-check: tag=$tag exit=$LASTEXITCODE matches=[$($tagCheck -join '; ')]"
            if ($LASTEXITCODE -eq 0) {
              throw "Stable tag $tag already exists. Bump package.json version before merging to master."
            }
            if ($LASTEXITCODE -ne 2) {
              throw "Tag existence check failed unexpectedly (exit=$LASTEXITCODE): $($tagCheck -join '; ')"
            }
          } else {
            throw "Unsupported release branch: $branch"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "build_version=$buildVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "release_name=File Pilot $tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        shell: pwsh
        run: npm version "${{ steps.meta.outputs.build_version }}" --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        run: npm run dist:win

      - name: Ensure installer and metadata exist
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue
          if ($null -eq $assets -or $assets.Count -eq 0) {
            throw "No installer asset found in release/*.exe"
          }

          $metadata = Get-ChildItem -Path release -Filter latest*.yml -ErrorAction SilentlyContinue
          if ($null -eq $metadata -or $metadata.Count -eq 0) {
            throw "No update metadata found in release/latest*.yml"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest*.yml
