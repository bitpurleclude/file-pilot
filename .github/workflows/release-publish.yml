name: Release Publish

on:
  push:
    branches:
      - beta
      - master

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build And Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is empty"
          }

          if ($branch -eq "beta") {
            $tag = "v$version-beta.${{ github.run_number }}"
            $channel = "beta"
            $prerelease = "true"
          } elseif ($branch -eq "master") {
            $tag = "v$version"
            $channel = "stable"
            $prerelease = "false"

            git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "Stable tag $tag already exists. Bump package.json version before merging to master."
            }
          } else {
            throw "Unsupported release branch: $branch"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "release_name=File Pilot $tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Ensure installer output exists
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue
          if ($null -eq $assets -or $assets.Count -eq 0) {
            throw "No installer asset found in release/*.exe"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release/*.exe
