name: Release Publish

on:
  push:
    branches:
      - beta
      - master

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build And Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = "Stop"
            $branch = "${{ github.ref_name }}"
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "package.json version is empty"
            }

            # The application reports package.json version at runtime, so the
            # built version must equal the release tag's version. Beta builds
            # therefore carry the prerelease suffix in package.json itself;
            # otherwise a 0.1.0 build can never see v0.1.0-beta.N updates.
            $baseVersion = ($version -split '-', 2)[0]

            if ($branch -eq "beta") {
              $buildVersion = "$baseVersion-beta.${{ github.run_number }}"
              $tag = "v$buildVersion"
              $channel = "beta"
              $prerelease = "true"
            } elseif ($branch -eq "master") {
              if ($version -match '-') {
                throw "Stable releases require a version without a prerelease suffix (found $version)."
              }
              $buildVersion = $version
              $tag = "v$version"
              $channel = "stable"
              $prerelease = "false"

              # Existence via output text: no --exit-code/LASTEXITCODE semantics.
              $existing = (git ls-remote --tags origin "refs/tags/$tag") | Out-String
              $tagExists = $existing.Trim().Length -gt 0
              Write-Host "tag-check: tag=$tag exists=$tagExists raw=[$($existing.Trim())]"
              if ($tagExists) {
                throw "Stable tag $tag already exists. Bump package.json version before merging to master."
              }
            } else {
              throw "Unsupported release branch: $branch"
            }

            $outFile = $env:GITHUB_OUTPUT
            if ([string]::IsNullOrWhiteSpace($outFile)) {
              throw "GITHUB_OUTPUT is not set by the runner."
            }
            Add-Content -Path $outFile -Value "version=$version"
            Add-Content -Path $outFile -Value "build_version=$buildVersion"
            Add-Content -Path $outFile -Value "tag=$tag"
            Add-Content -Path $outFile -Value "channel=$channel"
            Add-Content -Path $outFile -Value "prerelease=$prerelease"
            Add-Content -Path $outFile -Value "release_name=File Pilot $tag"
            Write-Host "meta ok: tag=$tag channel=$channel"
          } catch {
            Write-Host "META_FAILED: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        shell: pwsh
        run: npm version "${{ steps.meta.outputs.build_version }}" --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        run: npm run dist:win

      - name: Ensure installer and metadata exist
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue
          if ($null -eq $assets -or $assets.Count -eq 0) {
            throw "No installer asset found in release/*.exe"
          }

          $metadata = Get-ChildItem -Path release -Filter latest*.yml -ErrorAction SilentlyContinue
          if ($null -eq $metadata -or $metadata.Count -eq 0) {
            throw "No update metadata found in release/latest*.yml"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest*.yml
